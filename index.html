<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>在庫コード検索 - Advanced</title>
  <meta name="description" content="在庫コードを検索・管理。入出庫記録、予測使用量計算、バックアップ対応。" />

  <!-- SheetJS -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <!-- Dexie.js for IndexedDB -->
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
  <!-- Html5-Qrcode for Barcode Scanning -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- Fuse.js for Fuzzy Search -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --bg2:       #161b22;
      --bg3:       #1c232d;
      --border:    rgba(99,178,255,0.12);
      --accent:    #3b8afa;
      --accent2:   #7c5cfc;
      --green:     #2dd4a0;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --danger:    #f85149;
      --glass:     rgba(255,255,255,0.04);
      --glow:      0 0 24px rgba(59,138,250,0.18);
      --radius:    14px;
      --radius-sm: 8px;
    }

    html { font-size: 15px; scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans JP', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 60% at 20% -10%, rgba(59,138,250,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 110%, rgba(124,92,252,0.08) 0%, transparent 60%);
    }

    /* ===== LAYOUT ===== */
    .app-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,17,23,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex; align-items: center; gap: 14px;
    }
    .app-header .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
      box-shadow: var(--glow);
    }
    .app-header h1 {
      font-size: 1.1rem; font-weight: 700;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .app-header .sub { font-size: 0.75rem; color: var(--muted); margin-top: 1px; }
    .header-actions { margin-left: auto; display: flex; gap: 10px; }

    .main { max-width: 1400px; margin: 0 auto; padding: 32px 24px 60px; }

    /* ===== BUTTONS ===== */
    .btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { background: rgba(59,138,250,0.1); border-color: var(--accent); }
    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; color: #fff; font-weight: 600;
      box-shadow: 0 4px 12px rgba(59, 138, 250, 0.25);
    }
    .btn.primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(59, 138, 250, 0.35); }
    .btn.danger { background: rgba(248,81,73,0.1); border-color: rgba(248,81,73,0.3); color: var(--danger); }
    .btn.danger:hover { background: rgba(248,81,73,0.2); }

    /* ===== FILE LOADER ===== */
    .file-zone {
      background: var(--glass);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .file-zone::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(59,138,250,0.04), rgba(124,92,252,0.04));
      opacity: 0; transition: opacity 0.2s;
    }
    .file-zone:hover, .file-zone.drag { border-color: var(--accent); background: rgba(59,138,250,0.05); }
    .file-zone:hover::before, .file-zone.drag::before { opacity: 1; }
    .file-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .file-zone .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .file-zone p { color: var(--muted); font-size: 0.9rem; }
    .file-zone p strong { color: var(--text); }

    /* ===== STATUS ===== */
    .status-bar {
      margin-top: 16px; margin-bottom: 24px;
      display: flex; align-items: center; gap: 10px;
      font-size: 0.82rem;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 20px; font-weight: 600; font-size: 0.78rem;
    }
    .badge.loaded  { background: rgba(45,212,160,0.12); color: var(--green); border: 1px solid rgba(45,212,160,0.25); }
    .badge.loading { background: rgba(59,138,250,0.12); color: var(--accent); border: 1px solid rgba(59,138,250,0.25); }
    .badge.error   { background: rgba(248,81,73,0.12);  color: var(--danger); border: 1px solid rgba(248,81,73,0.25); }
    .spinner { width: 10px; height: 10px; border: 2px solid transparent; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }

    /* ===== SEARCH PANEL ===== */
    .search-panel {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--glow);
    }
    .search-panel label {
      display: block;
      font-size: 0.78rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .search-row { display: flex; gap: 10px; align-items: center; }
    .search-input {
      flex: 1;
      background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 12px 16px; font-size: 1rem; font-family: inherit; color: var(--text);
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,138,250,0.15); }

    /* ===== TABLE ===== */
    .table-wrap {
      margin-top: 24px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .table-scroll { overflow-x: auto; max-height: 70vh; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    thead {
      position: sticky; top: 0; z-index: 10;
      background: linear-gradient(180deg, var(--bg3), rgba(28,35,45,0.95));
      backdrop-filter: blur(8px);
    }
    th {
      padding: 11px 14px; text-align: left; font-size: 0.72rem; font-weight: 600;
      color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap;
      cursor: pointer; user-select: none;
    }
    th:hover { color: var(--accent); }
    tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.1s; }
    tbody tr:hover { background: rgba(59,138,250,0.06); }
    td { padding: 10px 14px; vertical-align: middle; }

    .td-code { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; font-weight: 600; color: var(--accent); }
    .td-num { font-family: 'JetBrains Mono', monospace; text-align: right; }
    .td-num.positive { color: var(--green); }
    .td-num.negative { color: var(--danger); }
    .td-num.muted { color: var(--muted); }

    /* IN/OUT Action Column */
    .action-cell { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
    .qty-input {
      width: 60px; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px;
      padding: 4px; color: var(--text); text-align: right; font-family: 'JetBrains Mono', monospace;
    }
    .qty-input:focus { border-color: var(--accent); outline: none; }
    .btn-icon {
      background: transparent; border: 1px solid var(--border); border-radius: 4px; color: var(--muted);
      padding: 4px 8px; cursor: pointer; transition: all 0.2s; font-size: 0.75rem;
    }
    .btn-icon:hover { border-color: var(--accent); color: var(--accent); }
    .btn-in { border-color: rgba(45,212,160,0.3); color: var(--green); }
    .btn-in:hover { background: rgba(45,212,160,0.1); border-color: var(--green); }
    .btn-out { border-color: rgba(248,81,73,0.3); color: var(--danger); }
    .btn-out:hover { background: rgba(248,81,73,0.1); border-color: var(--danger); }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      z-index: 1000; display: none; align-items: center; justify-content: center; padding: 10px;
    }
    .modal {
      background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
      width: 100%; max-width: 500px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      max-height: 95vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .modal-header h2 { margin: 0; font-size: 1.1rem; }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
    .modal-footer {
      padding: 12px 20px; border-top: 1px solid var(--border); background: var(--bg3);
      flex-shrink: 0; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap;
    }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    .form-group input {
      width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 12px; color: var(--text); outline: none;
    }
    .form-group input:focus { border-color: var(--accent); }

    .highlight { background-color: rgba(255, 235, 59, 0.35); color: #fff; border-radius: 2px; padding: 0 2px; }
    
    @media (max-width: 600px) {
      .hide-on-mobile { display: none !important; }
      .qty-input { width: 50px; }
      th, td { padding: 8px 6px; font-size: 0.78rem; }
    }

    .device-name-btn {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px; padding: 4px 10px; font-size: 0.75rem; color: var(--text);
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.2s;
    }
    .device-name-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }

    .hamburger-btn { display: none; background: transparent; border: none; font-size: 1.8rem; color: #fff; cursor: pointer; padding: 4px 8px; margin-left: auto; }
    .side-panel-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; }
    .side-panel-overlay.show { display: block; }
    
    @media (max-width: 1024px) {
      .hamburger-btn { display: block; z-index: 1001; }
      .header-actions {
        position: fixed; top: 0; right: -280px; width: 260px; height: 100vh;
        background: var(--bg2); border-left: 1px solid var(--border);
        flex-direction: column; align-items: flex-start;
        padding: 60px 20px 20px; box-shadow: -4px 0 15px rgba(0,0,0,0.5);
        transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000;
        overflow-y: auto;
      }
      .header-actions.open { right: 0; }
      .header-actions .btn { width: 100%; text-align: left; margin-bottom: 12px; padding: 12px; font-size: 1rem; }
      .device-name-btn { margin-bottom: 20px; width: 100%; justify-content: flex-start; padding: 10px; font-size: 1rem; }
    }

    /* ===== PORTRAIT WARNING ===== */
    #portraitWarning {
      display: none; position: fixed; inset: 0; background: rgba(13,17,23,0.95); backdrop-filter: blur(10px);
      z-index: 9999; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 30px;
    }
    #portraitWarning .icon { font-size: 4rem; margin-bottom: 20px; animation: tiltPhone 2s infinite ease-in-out; }
    #portraitWarning h2 { font-size: 1.5rem; margin-bottom: 15px; color: #fff; }
    #portraitWarning p { color: var(--muted); font-size: 1rem; line-height: 1.5; }

    @media screen and (orientation: portrait) and (pointer: coarse) {
      #portraitWarning { display: flex; }
    }

    @keyframes tiltPhone {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- PORTRAIT WARNING OVERLAY -->
<div id="portraitWarning">
  <div class="icon">📱</div>
  <h2>スマートフォンを<br>横向きにしてください</h2>
  <p>このシステムは横画面での利用に最適化されています。<br>端末の画面ロックを解除し、横向きにしてご利用ください。</p>
</div>

<header class="app-header">
  <div class="logo">📦</div>
  <div style="flex:1">
    <h1>在庫コード検索</h1>
    <div class="sub">DB保存・自動予測対応版</div>
  </div>
  
  <button class="hamburger-btn" onclick="toggleSidePanel()">☰</button>
  
  <div class="header-actions">
    <button class="device-name-btn" onclick="promptDeviceName()" title="端末名を設定">
      📱 <span id="deviceNameUI">未設定</span>
    </button>
    <button class="btn" onclick="openReportModal(); toggleSidePanel();">📊 月次レポート</button>
    <button class="btn" onclick="openItemModal(); toggleSidePanel();">＋ 新規アイテム</button>
    <button class="btn" onclick="exportMasterData(); toggleSidePanel();">📄 アイテムマスタDL</button>
    <button class="btn" onclick="exportBackup(); toggleSidePanel();">📥 DBバックアップ</button>
    <button class="btn" onclick="if(checkAdmin()) { document.getElementById('importBackupFile').click(); toggleSidePanel(); }">📤 復元・統合</button>
    <button class="device-name-btn" onclick="resetAdminPassword(); toggleSidePanel();" title="管理者パスワードのリセット" style="border:none; background:transparent;">🔒 パスワードリセット</button>
    <input type="file" id="importBackupFile" accept=".json" style="display:none" onchange="importBackup(event)" />
  </div>
</header>
<div id="sidePanelOverlay" class="side-panel-overlay" onclick="toggleSidePanel()"></div>

<main class="main">

  <!-- FILE LOADER (Only shown if DB is empty) -->
  <div id="setupSection" style="display:none">
    <div class="file-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".xlsx,.xls" />
      <div class="icon">📂</div>
      <p><strong>初期データ xlsx ファイルを選択</strong></p>
      <p style="margin-top:6px; font-size:0.8rem">※初回のみ。以後はブラウザにデータが保存されます</p>
    </div>
  </div>

  <div class="status-bar" id="statusBar" style="display:none">
    <div class="badge loading" id="statusBadge"><div class="spinner"></div><span id="statusText">読込中…</span></div>
    <span id="statusDetail" style="color:var(--muted)"></span>
  </div>

  <!-- SEARCH PANEL -->
  <div class="search-panel" id="mainApp" style="display:none">
    <label>🔍 品名・コード・バーコード・音声で検索</label>
    <div class="search-row" style="display:flex; gap:6px;">
      <input type="search" id="searchInput" class="search-input" placeholder="キーワード検索..." autocomplete="off" style="flex:1;" />
      <button class="btn" id="voiceSearchBtn" onclick="startVoiceSearch()" title="音声入力" style="padding: 6px 12px; font-size:1.2rem; min-width:44px; display:flex; justify-content:center; align-items:center;">🎤</button>
      <button class="btn primary" onclick="openScannerForSearch()" title="カメラ読取" style="padding: 6px 12px; font-size:1.2rem; min-width:44px; display:flex; justify-content:center; align-items:center;">📷</button>
      <button class="btn" onclick="clearSearch()" title="クリア" style="padding: 6px 12px; font-size:1.2rem; min-width:44px; display:flex; justify-content:center; align-items:center;">✕</button>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-wrap" id="tableWrap" style="display:none">
    <div class="table-scroll">
      <table id="resultTable">
        <thead>
          <tr>
            <th onclick="sortBy('code')">コード</th>
            <th onclick="sortBy('name')">品名</th>
            <th>規格</th>
            <th>現在庫</th>
            <th>1ヶ月予測</th>
            <th>年間使用量</th>
            <th style="text-align:right">操作</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>
</main>

<!-- REPORT MODAL -->
<div class="modal-overlay" id="reportModalOverlay">
  <div class="modal">
    <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="margin:0;">月次レポート出力</h2>
      <button class="btn-icon" onclick="openEmailSettings()" title="メール設定 (要管理者権限)" style="background:transparent; border:1px solid #ccc; font-size:1.2rem; padding:4px 8px;">⚙️</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>対象月</label>
        <input type="month" id="reportMonth" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeReportModal()">キャンセル</button>
      <div style="flex:1;"></div>
      <button class="btn" onclick="sendReportEmail()">📧 メール送信</button>
      <button class="btn primary" onclick="exportMonthlyReport()">📥 ダウンロード</button>
    </div>
  </div>
</div>

<!-- ITEM MODAL -->
<div class="modal-overlay" id="itemModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="itemModalTitle" style="margin:0;">アイテム追加</h2>
    </div>
    <div class="modal-body">
      <input type="hidden" id="modalMode" value="add" />
      <input type="hidden" id="modalOriginalCode" value="" />
      
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 12px;">
        <div class="form-group"><label>コード*</label><input type="text" id="mCode" /></div>
        <div class="form-group"><label>分類</label><input type="text" id="mCat" /></div>
        <div class="form-group"><label>メーカー</label><input type="text" id="mMaker" /></div>
        <div class="form-group"><label>品名*</label><input type="text" id="mName" /></div>
        <div class="form-group"><label>規格</label><input type="text" id="mSpec" /></div>
        <div class="form-group"><label>単位</label><input type="text" id="mUnit" /></div>
      </div>
      
      <div class="form-group">
        <label>バーコード</label>
        <div style="display:flex; gap:10px;">
          <input type="text" id="mBarcode" placeholder="スキャンまたは手入力" style="flex:1" />
          <button type="button" class="btn" onclick="openScannerForEdit()">📷 読取</button>
        </div>
      </div>
      <div class="form-group"><label>初期在庫（新規のみ）</label><input type="number" id="mRemain" value="0" /></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeItemModal()">キャンセル</button>
      <button class="btn primary" onclick="saveItem()">保存</button>
    </div>
  </div>
</div>

<!-- SCANNER MODAL -->
<div class="modal-overlay" id="scannerModalOverlay">
  <div class="modal" style="max-width: 400px;">
    <div class="modal-header">
      <h2 style="margin:0; text-align:center;">バーコード読取</h2>
    </div>
    <div class="modal-body" style="text-align: center;">
      <div id="reader" style="width:100%; margin: 0 auto;"></div>
    </div>
    <div class="modal-footer" style="justify-content: center;">
      <button class="btn" onclick="closeScannerModal()">キャンセル</button>
    </div>
  </div>
</div>

<script>
// =============================================
//  DB SETUP (Dexie)
// =============================================
const db = new Dexie("InventoryDB");
db.version(1).stores({
  items: 'code, cat, name',
  logs: '++id, code, type, date'
});

// State
let allItems = [];
let allLogs = [];
let filteredItems = [];
let itemStats = {}; // { code: { remain: 0, out1M: 0, out1Y: 0 } }
let sortKey = 'code';
let sortAsc = true;
let geoPos = null;
let fuseInstance = null; // Fuse.js instance for fuzzy searching
let currentDeviceName = localStorage.getItem('inventoryDeviceName') || '';

// =============================================
//  INIT & LOAD
// =============================================
window.addEventListener('DOMContentLoaded', async () => {
  // 端末名が未設定なら設定を促す
  if (!currentDeviceName) {
    promptDeviceName();
  } else {
    updateDeviceNameUI();
  }

  // Request Geolocation in background safely
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => { geoPos = { lat: pos.coords.latitude, lng: pos.coords.longitude }; },
      err => { console.warn("Geolocation denied or error:", err); },
      { timeout: 5000, maximumAge: 60000 }
    );
  }

  await loadFromDB();
});

async function loadFromDB() {
  showStatus("DB読込中...", "お待ちください");
  const cnt = await db.items.count();
  if (cnt === 0) {
    document.getElementById('setupSection').style.display = 'block';
    hideStatus();
    // 従来の自動読込を試行
    try {
      const res = await fetch('./data.xlsx');
      if (res.ok) {
        showStatus("自動読込中...", "data.xlsx");
        const buf = await res.arrayBuffer();
        await parseExcel(buf);
      }
    } catch (e) {
      console.warn("自動ロードスキップまたはエラー:", e);
    }
  } else {
    document.getElementById('setupSection').style.display = 'none';
    await refreshData();
    document.getElementById('mainApp').style.display = 'block';
    document.getElementById('tableWrap').style.display = 'block';
    hideStatus();
  }
}

async function refreshData() {
  try {
    allItems = await db.items.toArray();
    
    // Ensure all items are properly normalized (fixes old data missing half-width conversion)
    allItems.forEach(item => {
      item.nameNorm = normalize(item.name || '');
    });
    
    if (typeof Fuse !== 'undefined') {
      fuseInstance = new Fuse(allItems, {
        keys: ['nameNorm', 'code', 'barcode'],
        threshold: 0.3, // 0.3 allows slight typos
        ignoreLocation: true
      });
    }
    
    allLogs = await db.logs.toArray();
    calculateStats();
    doSearch();
  } catch(e) {
    console.error("Refresh Error:", e);
    alert("データの読み込み中にエラーが発生しました。");
  }
}

function calculateStats() {
  itemStats = {};
  const now = new Date();
  const th30 = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
  const th365 = new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000);

  allItems.forEach(item => {
    itemStats[item.code] = {
      remain: Number(item.remain) || 0,
      ordered: 0,
      out1M: 0,
      out1Y: 0
    };
  });

  allLogs.forEach(log => {
    if (!itemStats[log.code]) return;
    const stat = itemStats[log.code];
    const d = new Date(log.date);
    const qty = Number(log.qty) || 0;

    if (log.type === 'in' || log.type === 'receive') {
      stat.remain += qty;
      if (log.type === 'receive') stat.ordered -= qty;
    } else if (log.type === 'out') {
      stat.remain -= qty;
      if (d >= th30) stat.out1M += qty;
      if (d >= th365) stat.out1Y += qty;
    } else if (log.type === 'adjust') {
      stat.remain = qty;
    } else if (log.type === 'order') {
      stat.ordered += qty;
    }
  });

  // Clamp ordered to 0
  Object.values(itemStats).forEach(s => {
    if (s.ordered < 0) s.ordered = 0;
  });
}

document.getElementById('fileInput').addEventListener('change', e => {
  if (e.target.files[0]) {

    reader.onload = async (ev) => {

async function parseExcel(arrayBuffer) {
  try {
    const data = new Uint8Array(arrayBuffer);
    const wb = XLSX.read(data, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const range = XLSX.utils.decode_range(ws['!ref']);
    
    const COL = { code: 0, cat: 1, maker: 2, name: 3, spec: 4, unit: 5, remain: 10 };
    const rows = [];
    
    for (let r = 4; r <= range.e.r; r++) {
      const get = c => (ws[XLSX.utils.encode_cell({r, c})] || {}).v || '';
      const code = String(get(COL.code)).trim();
      const name = String(get(COL.name)).trim();
      if (!code || !name) continue;
      rows.push({
        code, cat: String(get(COL.cat)), maker: String(get(COL.maker)),
        name, spec: String(get(COL.spec)), unit: String(get(COL.unit)),
        remain: get(COL.remain), nameNorm: normalize(name)
      });
    }

    showStatus("DB保存中...", "しばらくお待ちください");
    await db.transaction('rw', db.items, async () => {
      await db.items.clear();
      await db.items.bulkPut(rows); // bulkAddからbulkPutに変更（重複コード対策）
    });

    document.getElementById('setupSection').style.display = 'none';
    await refreshData();
    document.getElementById('mainApp').style.display = 'block';
    document.getElementById('tableWrap').style.display = 'block';
    hideStatus();
  } catch (err) {
    console.error("解析エラー:", err);
    alert("読み込みエラー: " + err.message + "\n※Excelファイルの形式が異なるか、不正なデータが含まれている可能性があります。");
    hideStatus();
  }
}

const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', doSearch);

function doSearch() {
  try {
    const raw = searchInput.value || '';
    const keywords = raw.trim().split(/[\s　]+/).filter(k => k).map(k => normalize(k));

    if (keywords.length === 0) {
      filteredItems = allItems.slice();
    } else {
      // 1. まず完全一致・部分一致（AND検索）を試す
      filteredItems = allItems.filter(row =>
        keywords.every(kw => 
          (row.nameNorm || '').includes(kw) || 
          normalize(row.code || '').includes(kw) ||
          normalize(row.barcode || '').includes(kw)
        )
      );

      // 2. もし部分一致で1件も見つからなければ、あいまい検索（ファジー検索）に切り替える
      if (filteredItems.length === 0 && fuseInstance) {
        const rawNorm = normalize(raw);
        filteredItems = fuseInstance.search(rawNorm).map(result => result.item);
      }
    }
    
    filteredItems.sort((a, b) => {
      const v1 = a[sortKey] || '';
      const v2 = b[sortKey] || '';
      return String(v1).localeCompare(String(v2), 'ja') * (sortAsc ? 1 : -1);
    });

    renderTable();
  } catch(e) {
    console.error("Search Error:", e);
  }
}

function clearSearch() { searchInput.value = ''; doSearch(); }

function sortBy(key) {
  if (sortKey === key) sortAsc = !sortAsc;
  else { sortKey = key; sortAsc = true; }
  doSearch();
}

function renderTable() {
  const tbody = document.getElementById('resultBody');
  const cap = Math.min(filteredItems.length, 500);
  const rawQuery = document.getElementById('searchInput').value;
  let html = '';
  
  for (let i=0; i<cap; i++) {
    const item = filteredItems[i];
    const stat = itemStats[item.code] || { remain:0, out1M:0, out1Y:0 };
    const nameHtml = highlightAll(item.name, rawQuery);
    
    // 発注アラート判定: 在庫が1ヶ月予測の半分以下 (かつ1ヶ月予測が1以上)
    const needsReorder = (stat.out1M > 0) && (stat.remain <= (stat.out1M / 2));
    const reorderBadge = needsReorder ? `<br><span style="display:inline-block; margin-top:4px; padding:2px 6px; background:#ffebee; color:#c62828; border-radius:12px; font-size:0.7rem; font-weight:bold; white-space:nowrap; border:1px solid #ef9a9a;">⚠️要発注</span>` : '';
    const pendingBadge = stat.ordered > 0 ? `<br><span style="display:inline-block; margin-top:4px; padding:2px 6px; background:#e3f2fd; color:#1565c0; border-radius:12px; font-size:0.7rem; font-weight:bold; white-space:nowrap; border:1px solid #90caf9;">発注済:${stat.ordered}</span>` : '';
    const remainClass = stat.remain < 0 ? 'negative' : stat.remain > 0 ? 'positive' : 'muted';
    
    html += `<tr ${needsReorder && stat.ordered === 0 ? 'style="background-color:rgba(255, 235, 238, 0.4);"' : ''}>
      <td class="td-code">${esc(item.code)}</td>
      <td>${nameHtml}</td>
      <td class="td-num muted" style="text-align:left">${esc(item.spec)}</td>
      <td class="td-num ${remainClass}" style="vertical-align:middle;">${stat.remain.toLocaleString()}${reorderBadge}${pendingBadge}</td>
      <td class="td-num muted">${stat.out1M.toLocaleString()}</td>
      <td class="td-num muted">${stat.out1Y.toLocaleString()}</td>
      <td class="action-cell">
        <input type="number" min="1" class="qty-input" id="qty-${esc(item.code)}" placeholder="数" style="width:50px" />
        <button class="btn-icon btn-out" onclick="registerLog('${esc(item.code)}', 'out')" title="出庫">📤</button>
        <button class="btn-icon" style="color:#1565c0; border-color:rgba(21,101,192,0.3)" onclick="registerLog('${esc(item.code)}', 'order')" title="発注">🛒</button>
        <button class="btn-icon btn-in" onclick="registerLog('${esc(item.code)}', 'receive')" title="入荷">📥</button>
        <button class="btn-icon" onclick="editItem('${esc(item.code)}')" title="編集">✏️</button>
      </td>
    </tr>`;
  }
  tbody.innerHTML = html;
}

async function registerLog(code, type) {
  const input = document.getElementById(`qty-${code}`);
  const qty = Number(input.value);
  if (!qty || qty <= 0) { alert("数量を正しく入力してください"); return; }
  
  const log = {
    code,
    type,
    qty,
    date: new Date().toISOString(),
    device: currentDeviceName || navigator.userAgent,
    location: geoPos
  };

  if (type === 'receive') {
    // Calculate lead time based on FIFO order fulfillment
    const codeLogs = await db.logs.where('code').equals(code).toArray();
    codeLogs.sort((a, b) => new Date(a.date) - new Date(b.date));
    
    const orders = codeLogs.filter(l => l.type === 'order');
    const receives = codeLogs.filter(l => l.type === 'receive');
    
    const totalReceivedBefore = receives.reduce((sum, l) => sum + Number(l.qty), 0);
    const targetItemIndex = totalReceivedBefore + 1;
    
    let acc = 0;
    let targetOrderDate = null;
    for (const o of orders) {
      acc += Number(o.qty);
      if (acc >= targetItemIndex) {
        targetOrderDate = o.date;
        break;
      }
    }
    
    if (targetOrderDate) {
      const ms = new Date() - new Date(targetOrderDate);
      log.leadTimeDays = Math.round(ms / (1000 * 60 * 60 * 24));
    }
  }
  
  await db.logs.add(log);
  input.value = '';
  await refreshData();
}

async function saveItem() {
  const mode = document.getElementById('modalMode').value;
  const code = document.getElementById('mCode').value.trim();
  const name = document.getElementById('mName').value.trim();
  
  if (!code || !name) { alert("コードと品名は必須です"); return; }
  
  const item = {
    code,
    cat: document.getElementById('mCat').value.trim(),
    maker: document.getElementById('mMaker').value.trim(),
    name,
    spec: document.getElementById('mSpec').value.trim(),
    unit: document.getElementById('mUnit').value.trim(),
    barcode: document.getElementById('mBarcode').value.trim(),
    nameNorm: normalize(name)
  };
  
  if (mode === "add") {
    item.remain = Number(document.getElementById('mRemain').value) || 0;
    const exists = await db.items.get(code);
    if(exists) { alert("このコードは既に存在します"); return; }
    await db.items.put(item);
  } else {
    // Edit mode
    const origCode = document.getElementById('modalOriginalCode').value;
    const existing = await db.items.get(origCode);
    item.remain = existing.remain;
    await db.items.put(item);
    
    // Check if remain was adjusted
    const newQty = Number(document.getElementById('mRemain').value);
    const stat = itemStats[origCode] || { remain: 0 };
    if (!isNaN(newQty) && newQty !== stat.remain) {
      await db.logs.add({
        code: origCode,
        type: 'adjust',
        qty: newQty,
        date: new Date().toISOString(),
        device: currentDeviceName || navigator.userAgent,
        location: geoPos
      });
    }
  }
  
  closeItemModal();
  await refreshData();
}

async function importBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.items && data.logs) {
        
        const isMerge = confirm("【データの統合】\n現在のデータにバックアップの内容を追加（マージ）しますか？\n\n・[OK] 追加する（別端末の記録を合体してレポート等に反映）\n・[キャンセル] 現在のデータを全て消去して完全に上書きする");
        
        showStatus("データ復元中...", "お待ちください");

        if (!isMerge) {
          if(confirm("※本当に現在のデータを全て消去して上書きしますか？")) {
            await db.transaction('rw', db.items, db.logs, async () => {
              await db.items.clear();
              await db.logs.clear();
              await db.items.bulkAdd(data.items);
              await db.logs.bulkAdd(data.logs);
            });
            alert("すべてのデータを上書き復元しました");
          }
        } else {
          // マージ（統合）処理
          const localLogs = await db.logs.toArray();
          const localLogKeys = new Set(localLogs.map(l => `${l.code}_${l.type}_${l.date}`));
          
          const newLogs = [];
          for (const l of data.logs) {
            const key = `${l.code}_${l.type}_${l.date}`;
            if (!localLogKeys.has(key)) {
              delete l.id; // 新規IDを自動採番させるため
              newLogs.push(l);
            }
          }

          await db.transaction('rw', db.items, db.logs, async () => {
            // アイテムはコードをキーに上書き・追加
            await db.items.bulkPut(data.items);
            // ログは差分（新規）のみ追加
            if (newLogs.length > 0) {
              await db.logs.bulkAdd(newLogs);
            }
          });
          
          alert(`データを統合しました！\n追加された新しいログ: ${newLogs.length}件`);
        }
        
        hideStatus();
        await refreshData();
      } else {
        alert("無効なバックアップファイルです");
      }
    } catch(err) {
      alert("エラー: " + err.message);
      hideStatus();
    }
  };
  reader.readAsText(file);
  e.target.value = ''; // reset
}

async function exportMonthlyReport() {
  const ym = document.getElementById('reportMonth').value;
  if (!ym) return;
  const [year, month] = ym.split('-');
  
  const allLogs = await db.logs.toArray();
  // Filter logs for the specific month
  const targetLogs = allLogs.filter(log => {
    if (!['out', 'order', 'receive'].includes(log.type)) return false;
    const d = new Date(log.date);
    return d.getFullYear() === Number(year) && (d.getMonth() + 1) === Number(month);
  });
  
  if (targetLogs.length === 0) {
    alert("指定された月の履歴記録はありません。");
    return;
  }
  
  const itemsDict = {};
  for (const it of await db.items.toArray()) {
    itemsDict[it.code] = it;
  }
  
  const exportData = targetLogs.map(log => {
    const it = itemsDict[log.code] || {};
    const d = new Date(log.date);
    const dateStr = d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    
    let locStr = "";
    if (log.location && log.location.lat) {
      locStr = `Lat:${log.location.lat.toFixed(4)}, Lng:${log.location.lng.toFixed(4)}`;
    }
    
    let actionType = log.type === 'out' ? '出庫' : log.type === 'order' ? '発注' : '入荷';
    
    return {
      '日時': dateStr,
      '処理': actionType,
      'コード': log.code,
      '分類': it.cat || '',
      '品名': it.name || '',
      '規格': it.spec || '',
      'バーコード': it.barcode || '',
      '数量': log.qty,
      '入荷リードタイム(日)': log.leadTimeDays !== undefined ? log.leadTimeDays : '',
      '端末情報': log.device || '',
      '位置情報': locStr
    };
  });
  
  const worksheet = XLSX.utils.json_to_sheet(exportData);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, `${year}年${month}月_出庫記録`);
  
  XLSX.writeFile(workbook, `出庫レポート_${year}${month}.xlsx`);
  closeReportModal();
}

  const gasUrl = localStorage.getItem('inventoryGasUrl');
  if (!targetEmail || !gasUrl) {
    alert("送信先メールアドレスまたはGAS設定が完了していません。\n右上の「⚙️」ボタンから設定を行ってください。");
    return;
  }

  const rm = document.getElementById('reportMonth').value;
  if (!rm) { alert("月を選択してください"); return; }
  
  const [year, month] = rm.split('-');
  const start = new Date(year, month - 1, 1);
  const end = new Date(year, month, 1);

  const logs = await db.logs.where('date').between(start.toISOString(), end.toISOString()).toArray();
  const outLogs = logs.filter(l => ['out', 'order', 'receive'].includes(l.type));
  
  if (outLogs.length === 0) {
    alert("指定月の履歴記録がありません");
    return;
  }

  const exportData = outLogs.map(log => {
    const item = allItems.find(i => i.code === log.code) || {};
    let locStr = '';
    if (log.location) locStr = `https://maps.google.com/?q=${log.location.lat},${log.location.lng}`;
    
    let actionType = log.type === 'out' ? '出庫' : log.type === 'order' ? '発注' : '入荷';
    
    return {
      '日時': new Date(log.date).toLocaleString('ja-JP'),
      '処理': actionType,
      'コード': log.code,
      '分類': item.cat || '',
      'メーカー': item.maker || '',
      '品名': item.name || '',
      '規格': item.spec || '',
      'バーコード': item.barcode || '',
      '数量': log.qty,
      '入荷リードタイム(日)': log.leadTimeDays !== undefined ? log.leadTimeDays : '',
      '単位': item.unit || '',
      '端末情報': log.device || '',
      '位置情報': locStr
    };
  });
  
  const worksheet = XLSX.utils.json_to_sheet(exportData);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, `${year}年${month}月_出庫記録`);
  
  const wbout = XLSX.write(workbook, {bookType:'xlsx', type:'base64'});
  const filename = `出庫レポート_${year}${month}.xlsx`;

  showStatus("メール送信中...", "サーバーと通信しています");
  
  try {
    const payload = {
      email: targetEmail,
      subject: `【在庫管理】出庫レポート（${year}年${month}月）`,
      body: `${year}年${month}月の出庫レポートを添付いたします。\n\n本メールは在庫管理システムからの自動送信です。`,
      filename: filename,
      fileData: wbout
    };

    const res = await fetch(gasUrl, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    
    const text = await res.text();
    if (text.includes("error")) {
      alert("送信に失敗しました:\n" + text);
    } else {
      alert("メールの送信が完了しました！");
      closeReportModal();
    }
  } catch(err) {
    alert("送信エラー: " + err.message + "\nGASのURLや通信環境を確認してください。");
  } finally {
    hideStatus();
  }
}

function openEmailSettings() {
  if (!checkAdmin()) return;
  const currentUrl = localStorage.getItem('inventoryGasUrl') || '';
  const currentEmail = localStorage.getItem('inventoryTargetEmail') || '';
  
  const newEmail = prompt("【メール設定】\nレポートの送信先メールアドレスを入力してください:", currentEmail);
  if (newEmail === null) return;
  
  const newUrl = prompt("【メール設定】\nGoogle Apps Scriptの「WebアプリURL」を入力してください:\n（https://script.google.com/macros/s/...）", currentUrl);
  if (newUrl === null) return;
  
  localStorage.setItem('inventoryTargetEmail', newEmail.trim());
  localStorage.setItem('inventoryGasUrl', newUrl.trim());
  alert("メール設定を保存しました。");
}

async function exportMasterData() {
  const items = await db.items.toArray();
  const exportData = items.map(item => ({
    'コード': item.code,
    '分類': item.cat || '',
    'メーカー': item.maker || '',
    '品名': item.name || '',
    '規格': item.spec || '',
    '単位': item.unit || '',
    'バーコード': item.barcode || ''
  }));
  
  const worksheet = XLSX.utils.json_to_sheet(exportData);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, `アイテムマスター`);
  
  const d = new Date();
  const ym = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  XLSX.writeFile(workbook, `アイテムマスター_${ym}.xlsx`);
}

// =============================================
//  UTILS
// =============================================
function promptDeviceName() {
  const input = prompt("この端末の名前を入力してください\n（例：メインPC、倉庫のiPad、〇〇のスマホ 等）", currentDeviceName);
  if (input !== null) {
    const name = input.trim() || '名称未設定';
    localStorage.setItem('inventoryDeviceName', name);
    currentDeviceName = name;
    updateDeviceNameUI();
  }
}

function updateDeviceNameUI() {
  const el = document.getElementById('deviceNameUI');
  if (el) el.innerText = currentDeviceName || '未設定';
}

function checkAdmin() {
  const currentPass = localStorage.getItem('inventoryAdminPass');
  if (!currentPass) {
    const newPass = prompt("【初回設定】\n管理者用パスワードを設定してください。\n※この端末でのみ有効です。今後、編集や復元時に必要になります。");
    if (!newPass) return false;
    localStorage.setItem('inventoryAdminPass', newPass);
    alert("管理者パスワードを設定しました。");
    return true;
  } else {
    const input = prompt("管理パスワードを入力してください:");
    if (input === currentPass) {
      return true;
    } else {
      if (input !== null) alert("パスワードが違います。");
      return false;
    }
  }
}

function resetAdminPassword() {
  if (!localStorage.getItem('inventoryAdminPass')) {
    alert("パスワードはまだ設定されていません。");
    return;
  }
  if (confirm("管理者パスワードをリセット（削除）しますか？")) {
    localStorage.removeItem('inventoryAdminPass');
    alert("パスワードをリセットしました。次回編集時に再設定できます。");
  }
}

function toggleSidePanel() {
  if (window.innerWidth > 1024) return; // Prevent toggle action on PC view
  const panel = document.querySelector('.header-actions');
  const overlay = document.getElementById('sidePanelOverlay');
  if (panel) panel.classList.toggle('open');
  if (overlay) overlay.classList.toggle('show');
}

function highlightAll(text, rawQuery) {
  if (!rawQuery) return esc(text);
  const keywords = rawQuery.trim().split(/[\s　]+/).filter(k => k);
  if (keywords.length === 0) return esc(text);
  let html = esc(text);
  for (let kw of keywords) {
    let pat = new RegExp(escapeRegex(kw), 'gi');
    html = html.replace(pat, m => `<mark class="highlight">${m}</mark>`);
  }
  return html;
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function normalize(str) {
  if (!str) return '';
  let s = String(str);
  
  // 半角カナ → 全角カナ
  const kanaMap = {
    'ｶﾞ': 'ガ', 'ｷﾞ': 'ギ', 'ｸﾞ': 'グ', 'ｹﾞ': 'ゲ', 'ｺﾞ': 'ゴ',
    'ｻﾞ': 'ザ', 'ｼﾞ': 'ジ', 'ｽﾞ': 'ズ', 'ｾﾞ': 'ゼ', 'ｿﾞ': 'ゾ',
    'ﾀﾞ': 'ダ', 'ﾁﾞ': 'ヂ', 'ﾂﾞ': 'ヅ', 'ﾃﾞ': 'デ', 'ﾄﾞ': 'ド',
    'ﾊﾞ': 'バ', 'ﾋﾞ': 'ビ', 'ﾌﾞ': 'ブ', 'ﾍﾞ': 'ベ', 'ﾎﾞ': 'ボ',
    'ﾊﾟ': 'パ', 'ﾋﾟ': 'ピ', 'ﾌﾟ': 'プ', 'ﾍﾟ': 'ペ', 'ﾎﾟ': 'ポ',
    'ｳﾞ': 'ヴ', 'ﾜﾞ': 'ヷ', 'ｦﾞ': 'ヺ',
    'ｱ': 'ア', 'ｲ': 'イ', 'ｳ': 'ウ', 'ｴ': 'エ', 'ｵ': 'オ',
    'ｶ': 'カ', 'ｷ': 'キ', 'ｸ': 'ク', 'ｹ': 'ケ', 'ｺ': 'コ',
    'ｻ': 'サ', 'ｼ': 'シ', 'ｽ': 'ス', 'ｾ': 'セ', 'ｿ': 'ソ',
    'ﾀ': 'タ', 'ﾁ': 'チ', 'ﾂ': 'ツ', 'ﾃ': 'テ', 'ﾄ': 'ト',
    'ﾅ': 'ナ', 'ﾆ': 'ニ', 'ﾇ': 'ヌ', 'ﾈ': 'ネ', 'ﾉ': 'ノ',
    'ﾊ': 'ハ', 'ﾋ': 'ヒ', 'ﾌ': 'フ', 'ﾍ': 'ヘ', 'ﾎ': 'ホ',
    'ﾏ': 'マ', 'ﾐ': 'ミ', 'ﾑ': 'ム', 'ﾒ': 'メ', 'ﾓ': 'モ',
    'ﾔ': 'ヤ', 'ﾕ': 'ユ', 'ﾖ': 'ヨ',
    'ﾗ': 'ラ', 'ﾘ': 'リ', 'ﾙ': 'ル', 'ﾚ': 'レ', 'ﾛ': 'ロ',
    'ﾜ': 'ワ', 'ｦ': 'ヲ', 'ﾝ': 'ン',
    'ｧ': 'ァ', 'ｨ': 'ィ', 'ｩ': 'ゥ', 'ｪ': 'ェ', 'ｫ': 'ォ',
    'ｬ': 'ャ', 'ｭ': 'ュ', 'ｮ': 'ョ',
    'ｯ': 'ッ', 'ｰ': 'ー', '･': '・', 'ﾞ': '゛', 'ﾟ': '゜'
  };
  const reg = new RegExp(Object.keys(kanaMap).join('|'), 'g');
  s = s.replace(reg, match => kanaMap[match]);

  // 全角英数字 → 半角英数字
  s = s.replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  // ひらがな → カタカナ
  s = s.replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
  return s.toUpperCase();
}
function showStatus(text, detail) {
  document.getElementById('statusBar').style.display = 'flex';
  document.getElementById('statusText').innerText = text;
  document.getElementById('statusDetail').innerText = detail || '';
}
function hideStatus() {
  document.getElementById('statusBar').style.display = 'none';
}
